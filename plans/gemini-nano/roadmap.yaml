schema: roadmap/1
slug: gemini-nano
project: proclivity
title: "Gemini Nano (Chrome Prompt API)"
status: active
phase: sequenced
brief: |
  Let a single user chat with an LLM embedded in the new-tab page that can
  read and modify their planner state — no API keys, no Google Cloud project,
  typed prompts never leave the device. On-device Gemini Nano via Chrome's
  Prompt API; vertical slices: plumbing/availability surface, embedded chat
  side panel, then schema-constrained tool actions with Undo.
goal:
  hmw: How might we let a single user chat with an LLM embedded in the new-tab page that can read and modify their planner state, without API keys, without a Google Cloud project, and without their typed prompts ever leaving the device?
  objective: Ship an embedded, on-device LLM chat that can both have an open conversation and structurally modify Proclivity records — without ever touching the network for inference.
  key_results:
  - Connect flow takes zero clicks. Either Nano is available (chat is ready) or it's not (Settings shows availability state). No OAuth, no token, no console. Verified in gn-m1.
  - First todo generated in ≤ 4 seconds from chat-message submitted to record-in-state. Latency target accounts for Nano being slower than Flash. Verified in gn-m3.
  - ≥ 90% structured-output parse rate on a 20-prompt eval recorded in plans/gemini-nano-eval-snapshot.md at end of gn-m3.
  - 'Zero network calls. Verified by inspecting the chat code: grep -rn "fetch\|XMLHttpRequest" src/llm/ returns no remote URLs.'
  - Chat actions are reversible. Every record created via an LLM tool-call has a one-click Undo affordance visible for ≥ 10 seconds.
  assumptions:
  - tier: must
    text: Chrome's Prompt API + Gemini Nano is available on the user's Chrome installation (138+ with flags, or current Dev/Canary)
    validation: gemini-nano-spike-1 validates by detecting LanguageModel.availability() on a fresh install
  - tier: must
    text: responseConstraint (JSON Schema) produces parseable JSON ≥ 90% of the time for our concrete schemas (todos, Gantt tasks) — lower than the 95% bar from the Cloud roadmap because Nano is a smaller model
    validation: gemini-nano-spike-2 20-prompt eval, folded into m3's eval doc (plans/gemini-nano-eval-snapshot.md); failure paths explicit (retry once, then surface the raw response with an apology)
  - tier: should
    text: The 4 GB model download is acceptable one-time cost
    validation: Settings UI surfaces "Downloading Gemini Nano… (~4 GB)" when availability() === "downloading" so the user knows what's happening
  - tier: might
    text: Streaming responses meaningfully improve the chat UX over batched. Defer streaming to a later polish pass
  wont:
  - Cloud Gemini API. Anything that requires a Google Cloud project, an OAuth Client ID, or a billing account. Done; reverted.
  - Claude integration of any flavor. Separate effort; needs the MCP-server approach discussed earlier.
  - Multi-turn memory beyond the active session. When the user closes the side panel / clears chat, history is gone.
  - Voice or audio modalities. Text only.
  - Streaming responses in v1. Use prompt() (batched), not promptStreaming().
  - Internet-connected fallback when Nano is unavailable. The whole point is "no cloud" — show an empty state, don't fall back to Flash.
  - Persisting raw LLM prompts/responses to chrome.storage.local. Only the parsed records get saved.
